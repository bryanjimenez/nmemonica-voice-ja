on: workflow_call

jobs:
  test-pkg:
    environment: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: pkg

      - name: current version for test dependency
        run: node ./pkg_helper.js test-update

      - run: npm --prefix ./tests install

      - run: npm run --prefix ./tests test
