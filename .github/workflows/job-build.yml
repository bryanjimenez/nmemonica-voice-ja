on: workflow_call
permissions: {}

jobs:
  build:
    environment: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #actions/checkout@v7
        with:
          submodules: 'recursive'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f #actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: install cargo-audit
        run: |
          cargo install cargo-auditable
          cargo auditable install cargo-audit cargo-license wasm-pack
          cargo audit

      - name: build-pkg
        run: wasm-pack build --scope nmemonica --release

      - name: package third-party-notice
        run: node ./pkg_helper.js third-party

      - name: pack-pkg
        run: wasm-pack pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #actions/upload-artifact@v7
        with:
          name: pkg
          path: pkg/
          compression-level: 0
          retention-days: 1
